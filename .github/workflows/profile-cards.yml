name: Generate Profile Cards

on:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches: [main]
    # Without this, a run that pushes cards with a PAT would re-trigger itself.
    # (The built-in GITHUB_TOKEN never re-triggers, but a PAT would.)
    paths-ignore:
      - 'stats/**'
  workflow_dispatch:

permissions:
  contents: write

# One run at a time: a push landing during a scheduled run waits instead of racing it.
concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-cards
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate stats cards
        env:
          # Falls back to the built-in token, so no PAT setup is required.
          # Add a SUMMARY_GITHUB_TOKEN secret to also count private contributions.
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          STATS_LOGIN: ${{ github.repository_owner }}
        run: python3 .github/scripts/generate-stats.py

      - name: Commit cards
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats
          git diff --staged --quiet || git commit -m "Update stats cards"
          # main may have moved since checkout (another push, a previous run).
          # -X theirs keeps the cards generated by this run if both touched stats/.
          git pull --rebase -X theirs origin main
          git push
